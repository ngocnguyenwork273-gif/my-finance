<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="pGrad" x1="0%" y1="0%" x2="100%" y2="100%" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#0DBACC"/>
      <stop offset="100%" stop-color="#6FA8EE"/>
    </linearGradient>
  </defs>

  <!-- Thân chữ P, hơi uốn lượn 2 cạnh cho mềm mại -->
  <path d="M 300,230
           C 255,400 350,610 300,840
           L 470,840
           C 520,610 425,400 470,230
           Z" fill="url(#pGrad)"/>

  <!-- Bụng chữ P (vòng tròn rỗng) -->
  <circle cx="608" cy="400" r="300" fill="url(#pGrad)"/>
  <circle cx="608" cy="400" r="172" fill="#FBFCFE"/>

  <!-- Gấu trúc lồng trong bụng chữ P — bo tròn mềm mại hơn, mắt to tròn đối xứng cho dễ thương -->
  <g transform="translate(608,400) scale(0.34)">
    <!-- Tai -->
    <circle cx="-150" cy="-235" r="98" fill="#22222C"/>
    <circle cx="150" cy="-235" r="98" fill="#22222C"/>

    <!-- Đầu -->
    <ellipse cx="0" cy="15" rx="300" ry="270" fill="#FBFCFE"/>

    <!-- Vệt sáng nhẹ -->
    <ellipse cx="-95" cy="-130" rx="130" ry="55" fill="#ffffff" opacity="0.7"/>

    <!-- Mảng mắt tròn, đối xứng (không nghiêng) -->
    <circle cx="-128" cy="-30" r="86" fill="#22222C"/>
    <circle cx="128" cy="-30" r="86" fill="#22222C"/>

    <!-- Mắt to tròn -->
    <circle cx="-118" cy="-20" r="38" fill="#FFFFFF"/>
    <circle cx="118" cy="-20" r="38" fill="#FFFFFF"/>
    <circle cx="-108" cy="-14" r="19" fill="#1A1A22"/>
    <circle cx="128" cy="-14" r="19" fill="#1A1A22"/>
    <circle cx="-100" cy="-22" r="7" fill="#FFFFFF"/>
    <circle cx="136" cy="-22" r="7" fill="#FFFFFF"/>

    <!-- Mõm -->
    <ellipse cx="0" cy="100" rx="140" ry="98" fill="#FFFFFF"/>

    <!-- Mũi -->
    <path d="M-32,70 Q0,52 32,70 Q32,102 0,108 Q-32,102 -32,70 Z" fill="#22222C"/>

    <!-- Nụ cười -->
    <path d="M-42,132 Q0,166 42,132" stroke="#22222C" stroke-width="13" stroke-linecap="round" fill="none"/>

    <!-- Má hồng -->
    <circle cx="-148" cy="90" r="38" fill="#F18AB5" opacity="0.55"/>
    <circle cx="148" cy="90" r="38" fill="#F18AB5" opacity="0.55"/>
  </g>
</svg>
